<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#060b14">
<title>Supreme Interiotech & Constructions | Welcome</title>
<script>
  const INTRO_SEEN_KEY = 'supreme-interiotech-intro-seen';
  try {
    if (localStorage.getItem(INTRO_SEEN_KEY) === 'yes') {
      window.location.replace(new URL('index.html', window.location.href));
    }
  } catch {
    // Continue with the intro if browser storage is disabled.
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Montserrat:wght@700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html {
    width: 100%; height: 100%;
    background: #060b14;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    background: radial-gradient(circle at 30% 40%, #1a1612 0%, #091224 45%, #050912 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: cameraPush 7s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .flare {
    position: absolute;
    width: 60vw; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(245, 194, 107, 0.6), rgba(56, 228, 255, 0.4), transparent);
    filter: blur(4px);
    opacity: 0;
    z-index: 2;
    animation: flareSweep 4s ease-in-out 2.5s forwards;
  }

  .title-box {
    position: relative;
    z-index: 3;
    text-align: center;
  }

  h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(2.8rem, 5.5vw, 5.5rem);
    letter-spacing: 0.08em;
    color: #ffffff;
    text-shadow: 0 0 35px rgba(245, 194, 107, 0.35), 0 0 12px rgba(56, 228, 255, 0.25);
    opacity: 0;
    transform: translateY(18px);
    animation: revealTitle 1.4s cubic-bezier(0.16, 1, 0.3, 1) 2.8s forwards;
  }

  p {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: clamp(0.95rem, 1.5vw, 1.45rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #e8c78a;
    margin-top: 14px;
    opacity: 0;
    transform: translateY(12px);
    animation: revealTagline 1.3s cubic-bezier(0.16, 1, 0.3, 1) 3.3s forwards;
  }

  .fade-out {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    animation: endFade 0.8s ease-in 6.2s forwards;
  }

  @keyframes cameraPush {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
  }

  @keyframes flareSweep {
    0% { opacity: 0; transform: translateX(-25%) scaleX(0.5); }
    40% { opacity: 0.9; transform: translateX(0%) scaleX(1.1); }
    100% { opacity: 0; transform: translateX(25%) scaleX(0.6); }
  }

  @keyframes revealTitle {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes revealTagline {
    to { opacity: 0.92; transform: translateY(0); }
  }

  @keyframes endFade {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="fx"></canvas>
    <div class="flare"></div>
    <div class="title-box">
      <h1>𝕊𝕦𝕡𝕣𝕖𝕞𝕖 𝕀𝕟𝕥𝕖𝕣𝕚𝕠𝕥𝕖𝕔𝕙 𝕒𝕟𝕕 ℂ𝕠𝕟𝕤𝕥𝕣𝕦𝕔𝕥𝕚𝕠𝕟𝕤</h1>
      <p>I might not be where I want to be yet, but I get closer every day</p>
    </div>
    <div class="fade-out"></div>
  </div>

<script>
  const introSeenKey = 'supreme-interiotech-intro-seen';
  window.setTimeout(() => {
    try {
      localStorage.setItem(introSeenKey, 'yes');
    } finally {
      window.location.replace(new URL('index.html', window.location.href));
    }
  }, 7000);

  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let w = canvas.width = window.innerWidth;
  let h = canvas.height = window.innerHeight;

  const particles = Array.from({ length: 75 }, (_, i) => ({
    x: Math.random() * w,
    y: Math.random() * h,
    vx: (Math.random() * 2.5 + 1.2),
    size: i % 3 === 0 ? Math.random() * 14 + 6 : Math.random() * 2.2 + 0.8,
    isGold: i % 4 === 0,
    isBokeh: i % 6 === 0,
    alpha: Math.random() * 0.6 + 0.2
  }));

  const dataLines = Array.from({ length: 14 }, (_, i) => ({
    y: (h * 0.15) + (i * (h * 0.7 / 14)),
    x: -Math.random() * w,
    len: Math.random() * 260 + 120,
    speed: Math.random() * 9 + 6,
    alpha: Math.random() * 0.35 + 0.1
  }));

  let start = performance.now();

  function draw(now) {
    const elapsed = (now - start) / 1000;
    ctx.clearRect(0, 0, w, h);

    // Warm golden-hour bokeh glow early on
    const bokehFade = Math.max(0, 1 - elapsed / 3.5);
    particles.forEach(p => {
      p.x += p.vx;
      if (p.x > w + 40) p.x = -40;

      if (p.isBokeh && bokehFade > 0) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2.5);
        grad.addColorStop(0, `rgba(245, 185, 90, ${0.22 * bokehFade})`);
        grad.addColorStop(1, 'rgba(245, 185, 90, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.isGold
          ? `rgba(245, 194, 107, ${p.alpha})`
          : `rgba(56, 228, 255, ${p.alpha})`;
        ctx.fillRect(p.x, p.y, p.isGold ? p.size * 0.3 : p.size * 1.4, 1.5);
      }
    });

    // Sweeping cyan data lines
    const lineFade = elapsed < 3.6 ? 1 : Math.max(0, 1 - (elapsed - 3.6) / 1.5);
    if (lineFade > 0) {
      dataLines.forEach(l => {
        l.x += l.speed;
        if (l.x > w + l.len) l.x = -l.len;
        const grad = ctx.createLinearGradient(l.x, l.y, l.x + l.len, l.y);
        grad.addColorStop(0, 'rgba(56, 228, 255, 0)');
        grad.addColorStop(0.5, `rgba(56, 228, 255, ${l.alpha * lineFade})`);
        grad.addColorStop(1, 'rgba(56, 228, 255, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(l.x + l.len, l.y);
        ctx.stroke();
      });
    }

    if (elapsed < 7.2) requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
</script>
</body>
</html>
